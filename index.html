    /* Contenedor 3D para flip */
    .flip-container {
      perspective: 1000px;
    }
    .flipper {
      transition: transform 0.8s;
      transform-style: preserve-3d;
      position: relative;
      width: 100%;
      height: 100%;
    }
    .flip-container.flipped .flipper {
      transform: rotateY(180deg);
    }
    .front, .back {
      backface-visibility: hidden;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 1rem;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent; /* sin color de fondo */
    }
    .back {
      transform: rotateY(180deg);
    }
  </style>
