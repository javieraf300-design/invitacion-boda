    .flipper {
      transition: transform 0.8s;
      transform-style: preserve-3d;
      position: relative;
      width: 100%;
      height: 100%;

      transform: rotateY(180deg);

    .front, .back {
      backface-visibility: hidden;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 1rem;
      overflow: hidden;
    }
    .back {
      transform: rotateY(180deg);
    }
